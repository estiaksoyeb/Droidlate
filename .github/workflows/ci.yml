---
name: CI Checks

'on':
  push:  # Trigger on every push to any branch
  pull_request:
    branches: [master]  # Trigger on pull requests targeting the master branch

jobs:
  validate:
    name: Build & Validate Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & testing tools
        run: |
          python -m pip install --upgrade pip build
          pip install -r requirements.txt

      - name: Run unit test suite
        run: python -m unittest discover tests

      - name: Verify package builds successfully
        run: python -m build

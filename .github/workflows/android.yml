---
name: Android App CI & Release Build

'on':
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]

jobs:
  build-apk:
    name: Build Android APKs (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.11 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Signing Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode \
            > /tmp/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          RELEASE_STORE_FILE: /tmp/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidlate-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidlate-app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  publish-github-release:
    name: Attach APKs to GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: droidlate-app-debug
          path: ./apks

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: droidlate-app-release
          path: ./apks

      - name: Rename APKs with Version Tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          mv ./apks/app-debug.apk ./apks/droidlate-${TAG_NAME}-debug.apk
          mv ./apks/app-release.apk ./apks/droidlate-${TAG_NAME}-release.apk
          ls -la ./apks

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./apks/droidlate-*-debug.apk
            ./apks/droidlate-*-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
